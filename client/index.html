<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0908" />
    <!-- The color theme this device last used (src/themes.js), set before the page draws so it doesn't flash. -->
    <script>
      try {
        var t = localStorage.getItem('rollbound:theme');
        if (['infernal', 'mirage', 'gothic', 'frigid', 'obscure', 'luminary', 'radiant', 'tunic', 'ethereal', 'badge', 'traveler', 'judgement', 'atrophy', 'emblem', 'tarnished', 'briar'].indexOf(t) !== -1) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <!-- Placeholder logo until the final one is ready: favicon-32, apple-touch-icon and logo-512 in public/, and src/assets/logo.webp in the app. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>RollBound · Pathfinder 2e Companion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
